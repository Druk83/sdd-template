services:
  kroki:
    image: ${KROKI_IMAGE}
    restart: unless-stopped
    depends_on:
      - bpmn
    environment:
      KROKI_MAX_URI_LENGTH: ${KROKI_MAX_URI_LENGTH}
      PLANTUML_LIMIT_SIZE: ${PLANTUML_LIMIT_SIZE}
      KROKI_BPMN_HOST: bpmn
    networks:
      - kroki-internal

  bpmn:
    image: ${KROKI_BPMN_IMAGE}
    restart: unless-stopped
    expose:
      - "8003"
    networks:
      - kroki-internal

  bpmn-png:
    image: ${KROKI_BPMN_IMAGE}
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["/usr/local/kroki/bpmn-png-server.mjs"]
    mem_limit: ${KROKI_BPMN_PNG_MEMORY_LIMIT:-512m}
    cpus: ${KROKI_BPMN_PNG_CPU_LIMIT:-1.0}
    volumes:
      - ./bpmn-png-server.mjs:/usr/local/kroki/bpmn-png-server.mjs:ro
      - ./bpmn-png-handler.mjs:/usr/local/kroki/bpmn-png-handler.mjs:ro
    ports:
      - "127.0.0.1:${KROKI_BPMN_PNG_PORT}:8001"
    networks:
      - kroki-internal

networks:
  kroki-internal:
    driver: bridge
